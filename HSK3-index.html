<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK3 لتعلم اللغة الصينية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js"></script>
<style>
  :root{
    --red-seal:#DC460A;      /* primary gold - icons, CTAs */
    --red-deep:#44190E;      /* deep amber - grammar */
    --red-mid:#C1592A;       /* texts/dialogues */
    --red-warm:#E8834D;      /* vocabulary - warm golden yellow */
    --cream:#F7F1EC;
    --cream2:#F0E4DC;
    --paper:#FFF9F6;
    --ink:#3A2317;
    --ink-soft:#8A7566;
    --gold:#DC460A;
    --line:#E5D9CE;
    --red-mid-solid:#963D14;  /* darker, accessible-contrast version of red-mid for white text/icons */
    --red-warm-solid:#8a5230; /* darker, accessible-contrast version of red-warm for white text/icons */
    --red-seal-solid:#B23A0C; /* darker, accessible-contrast version of red-seal for white text/icons */
    --shadow: 0 10px 30px -12px rgba(220,70,10,.25);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Cairo','Inter',sans-serif;
    line-height:1.7;
  }
  body.lang-en{font-family:'Inter','Cairo',sans-serif;}
  [dir="ltr"] body{font-family:'Inter','Cairo',sans-serif;}
  .zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Heiti SC','WenQuanYi Micro Hei',sans-serif;direction:ltr;unicode-bidi:isolate;}
  .zh-display{font-family:'Noto Serif SC','Songti SC','SimSun','Noto Sans SC',serif;direction:ltr;unicode-bidi:isolate;}
  .pinyin{font-family:'Inter',sans-serif;direction:ltr;unicode-bidi:isolate;color:var(--ink-soft);font-style:italic;}

  a{color:inherit;text-decoration:none;}
  .container{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* ===== Top bar ===== */
  header.topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(250,244,239,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1080px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;cursor:pointer;}
  .seal{
    width:34px;height:34px;border-radius:8px;background:var(--red-seal-solid);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif SC','Songti SC','SimSun','Noto Sans SC',serif;font-weight:900;font-size:1.15rem;
    box-shadow: var(--shadow);
    transform:rotate(-4deg);
  }
  nav.mainnav{display:flex;gap:4px;flex-wrap:wrap;}
  nav.mainnav a{
    padding:8px 14px;border-radius:999px;font-weight:600;font-size:.92rem;
    color:var(--ink-soft);transition:.15s;
  }
  nav.mainnav a.active, nav.mainnav a:hover{background:var(--red-seal-solid);color:#fff;}
  .lang-toggle{
    display:flex;border:1.5px solid var(--red-seal-solid);border-radius:999px;overflow:hidden;
    font-size:.82rem;font-weight:700;flex-shrink:0;
  }
  .lang-toggle button{
    padding:7px 14px;border:none;background:transparent;color:var(--red-seal-solid);cursor:pointer;
  }
  .lang-toggle button.active{background:var(--red-seal-solid);color:#fff;}

  /* ===== Home ===== */
  .hero{
    position:relative;overflow:hidden;
    padding:70px 24px 60px;
    background:
      radial-gradient(circle at 85% 20%, rgba(220,70,10,.10), transparent 55%),
      radial-gradient(circle at 10% 90%, rgba(220,70,10,.14), transparent 50%);
  }
  .hero-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:48px;flex-wrap:wrap;}
  .hero-text{flex:1 1 380px;}
  .eyebrow{
    display:inline-block;color:var(--red-seal-solid);font-weight:800;letter-spacing:.06em;
    font-size:.82rem;margin-bottom:14px;text-transform:uppercase;
  }
  .hero h1{
    font-size:2.5rem;line-height:1.25;margin:0 0 18px;font-weight:800;
  }
  .hero h1 .accent{color:var(--red-seal-solid);}
  .hero p.lead{font-size:1.08rem;color:var(--ink-soft);max-width:46ch;margin:0 0 28px;}
  .hero-cta{display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;
    font-weight:700;font-size:.95rem;cursor:pointer;border:none;transition:.15s;
  }
  .btn-primary{background:var(--red-seal-solid);color:#fff;box-shadow:var(--shadow);}
  .btn-primary:hover{background:var(--red-deep);}
  .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--red-seal-solid);color:var(--red-seal-solid);}

  .hero-seal-big{
    flex:0 0 220px;width:220px;height:220px;border-radius:22px;
    background:linear-gradient(155deg,var(--red-seal-solid),var(--red-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow: var(--shadow);
    transform:rotate(3deg);
  }
  .hero-seal-big span{
    font-family:'Noto Serif SC','Songti SC','SimSun','Noto Sans SC',serif;color:#fff;font-size:6.2rem;font-weight:900;
    text-shadow:0 4px 12px rgba(0,0,0,.25);
  }

  .stats{display:flex;gap:0;margin-top:52px;border-top:1px solid var(--line);padding-top:28px;flex-wrap:wrap;}
  .stat{flex:1 1 140px;text-align:center;}
  .stat b{display:block;font-size:1.9rem;color:var(--red-seal-solid);font-weight:900;}
  .stat span{font-size:.85rem;color:var(--ink-soft);}

  /* Section cards */
  .section-cards{padding:10px 24px 70px;}
  .cards-grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media(max-width:820px){.cards-grid{grid-template-columns:1fr;}}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px;transition:.18s;position:relative;overflow:hidden;cursor:pointer;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
  .card .bar{position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;}
  .card.texts .bar{background:var(--red-mid);}
  .card.grammar .bar{background:var(--red-deep);}
  .card.vocab .bar{background:var(--red-warm);}
  .card .icon{
    width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:1.4rem;margin-bottom:16px;
  }
  .card.texts .icon{background:var(--red-mid-solid);}
  .card.grammar .icon{background:var(--red-deep);}
  .card.vocab .icon{background:var(--red-warm-solid);}
  .card h3{margin:0 0 8px;font-size:1.2rem;font-weight:800;}
  .card p{margin:0;color:var(--ink-soft);font-size:.92rem;}

  /* ===== Page header ===== */
  .page-head{padding:44px 24px 18px;border-bottom:1px solid var(--line);}
  .page-head h1{margin:0 0 8px;font-size:1.9rem;font-weight:800;}
  .page-head p{color:var(--ink-soft);margin:0;max-width:60ch;}
  .search-box{
    max-width:1080px;margin:22px auto 0;
  }
  .search-box input{
    width:100%;padding:13px 18px;border:1.5px solid var(--line);border-radius:12px;
    font-size:.98rem;font-family:inherit;background:var(--paper);
  }
  .search-box input:focus{outline:none;border-color:var(--red-seal-solid);}

  /* ===== Lessons list ===== */
  .lessons-grid{max-width:1080px;margin:0 auto;padding:34px 24px 80px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:900px){.lessons-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.lessons-grid{grid-template-columns:1fr;}}
  .lesson-tile{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;cursor:pointer;transition:.15s;position:relative;
  }
  .lesson-tile:hover{border-color:var(--red-seal-solid);box-shadow:var(--shadow);}
  .lesson-tile.disabled{opacity:.55;cursor:default;}
  .lesson-tile.disabled:hover{border-color:var(--line);box-shadow:none;}
  .lesson-num{
    display:inline-flex;width:30px;height:30px;border-radius:8px;background:var(--red-mid-solid);color:#fff;
    align-items:center;justify-content:center;font-weight:800;font-size:.85rem;margin-bottom:12px;
  }
  .lesson-tile h4{margin:0 0 4px;font-size:1.05rem;font-weight:700;}
  .lesson-tile .zh{font-size:1.15rem;font-weight:700;display:block;margin-bottom:4px;}
  .badge-soon{
    position:absolute;top:16px;inset-inline-end:16px;font-size:.72rem;font-weight:700;
    color:var(--gold);background:rgba(220,70,10,.15);padding:3px 10px;border-radius:999px;
  }
  .badge-done{
    position:absolute;top:16px;inset-inline-end:16px;font-size:.85rem;font-weight:700;
    color:#fff;background:#3a8a4c;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .badge-score{
    position:absolute;top:16px;inset-inline-end:16px;font-size:.7rem;font-weight:700;
    color:var(--red-mid-solid);background:rgba(193,89,42,.13);padding:3px 9px;border-radius:999px;
  }
  .home-progress-bar{
    max-width:1080px;margin:6px auto 0;height:8px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden;
  }
  .home-progress-fill{height:100%;background:var(--red-seal-solid);border-radius:999px;transition:width .4s;}

  /* ===== Lesson detail ===== */
  .lesson-detail{max-width:900px;margin:0 auto;padding:34px 24px 90px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--red-seal-solid);font-weight:700;margin-bottom:18px;cursor:pointer;}
  .lesson-title-block{margin-bottom:8px;}
  .lesson-title-block .zh-display{font-size:2.1rem;display:block;margin-bottom:6px;}
  .lesson-title-block .en{color:var(--ink-soft);font-size:1.05rem;}
  .complete-toggle{margin:6px 0 22px;font-size:.9rem;}
  .lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:22px;border-top:1px solid var(--line);}
  .lesson-nav button{flex:0 1 auto;}
  .objectives{
    background:var(--cream2);border-radius:var(--radius);padding:20px 24px;margin:22px 0 36px;
    border-inline-start:4px solid var(--red-seal-solid);
  }
  .objectives h4{margin:0 0 10px;font-size:.95rem;color:var(--red-deep);font-weight:800;}
  .objectives ul{margin:0;padding-inline-start:20px;}
  .objectives li{margin-bottom:6px;font-size:.95rem;}

  .text-block{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .text-head{
    background:var(--red-mid-solid);color:#fff;padding:16px 22px;
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;flex-wrap:wrap;
  }
  .text-head h3{margin:0;font-size:1.05rem;font-weight:800;flex:1 1 160px;min-width:0;}
  .text-head .chev{transition:.2s;flex-shrink:0;}
  .text-head.open .chev{transform:rotate(180deg);}
  .text-body{padding:22px 24px;display:none;}
  .text-body.open{display:block;}
  .text-context{color:var(--ink-soft);font-size:.9rem;margin-bottom:18px;font-style:italic;}
  .dialogue-line{
    display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);
  }
  .dialogue-line:last-child{border-bottom:none;}
  .speaker{font-weight:700;font-size:.85rem;color:var(--red-mid);}
  .dline-zh{font-size:1.25rem;font-weight:600;}
  .dline-py{margin:2px 0 4px;font-size:.9rem;}
  .dline-en{font-size:.88rem;color:var(--ink-soft);}
  .dline-ar{font-size:.88rem;color:var(--ink-soft);}

  .vocab-mini-title{margin:22px 0 10px;font-size:.85rem;font-weight:800;color:var(--red-warm);text-transform:uppercase;letter-spacing:.04em;}
  .vocab-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;}
  @media(max-width:640px){.vocab-mini{grid-template-columns:1fr;}}
  .vocab-mini-item{
    background:var(--cream);border-radius:10px;padding:10px 14px;font-size:.88rem;
    border-inline-start:3px solid var(--red-warm);
  }
  .vocab-mini-item .zh{font-size:1.05rem;font-weight:700;}
  .vocab-mini-item .pos{color:var(--gold);font-size:.75rem;}

  .grammar-card{
    background:var(--paper);border:1px solid var(--line);border-inline-start:4px solid var(--red-deep);
    border-radius:var(--radius);padding:20px 24px;margin:16px 0;
  }
  .grammar-card h4{margin:0 0 8px;color:var(--red-deep);font-size:1rem;font-weight:800;}
  .grammar-card .explain{font-size:.92rem;margin-bottom:10px;}
  .grammar-card .examples{background:var(--cream);border-radius:10px;padding:12px 16px;font-size:.92rem;}
  .grammar-card .examples div{padding:3px 0;}

  .tip-box{
    background:#FBF0E9;border:1px solid var(--gold);border-radius:12px;padding:14px 18px;font-size:.88rem;margin:16px 0;
  }
  .tip-box b{color:var(--gold);}

  .misc-section{margin-top:34px;padding-top:24px;border-top:1px solid var(--line);}
  .misc-section h4{color:var(--red-seal-solid);font-size:.95rem;font-weight:800;margin-bottom:8px;}
  .quiz-section{margin-top:34px;padding-top:24px;border-top:2px solid var(--red-seal-solid);}
  .quiz-section h4{color:var(--red-seal-solid);font-size:1.05rem;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .quiz-sub{color:var(--ink-soft);font-size:.88rem;margin-bottom:18px;}
  .quiz-q{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;}
  .quiz-q-head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px;}
  .quiz-q-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--red-warm-solid);color:#fff;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .quiz-q-text{font-weight:700;font-size:.96rem;}
  .quiz-q-zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Heiti SC','WenQuanYi Micro Hei',sans-serif;color:var(--red-mid);font-size:1.05rem;margin-inline-start:4px;}
  .quiz-opts{display:flex;flex-direction:column;gap:8px;margin-inline-start:36px;}
  .quiz-opt{display:flex;align-items:center;gap:10px;padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:.92rem;transition:.15s;background:var(--cream);}
  .quiz-opt:hover{border-color:var(--red-warm);}
  .quiz-opt input{accent-color:var(--red-seal-solid);}
  .quiz-opt.q-correct{border-color:#2e8b57;background:#e9f7ef;color:#1f6b41;font-weight:700;}
  .quiz-opt.q-wrong{border-color:var(--red-seal-solid);background:#fbe9e9;color:var(--red-deep);font-weight:700;}
  .quiz-actions{display:flex;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap;}
  .quiz-result{font-weight:800;font-size:1rem;padding:10px 18px;border-radius:10px;background:var(--cream2);display:none;}
  .quiz-result.show{display:inline-block;}

  /* ===== Grammar & Vocab index pages ===== */
  .grammar-list, .vocab-list{max-width:1080px;margin:0 auto;padding:30px 24px 90px;}
  .lesson-group{margin-bottom:36px;}
  .lesson-group h3{
    font-size:1.05rem;font-weight:800;color:var(--red-deep);margin-bottom:14px;
    display:flex;align-items:center;gap:10px;
  }
  .lesson-group h3 .zh{font-weight:700;}

  .vocab-table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
  .vocab-table th{background:var(--red-warm-solid);color:#fff;text-align:start;padding:10px 14px;font-size:.82rem;}
  .vocab-table td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top;}
  .vocab-table tr:last-child td{border-bottom:none;}
  .vocab-table .zh{font-size:1.1rem;font-weight:700;}

  /* ===== Vocab mode switch & Flashcards ===== */
  .vocab-mode-switch{display:flex;gap:8px;margin-top:14px;}
  .flashcards-wrap{max-width:520px;margin:10px auto 90px;padding:0 24px;display:flex;flex-direction:column;align-items:center;}
  .flash-progress{color:var(--ink-soft);font-weight:700;margin-bottom:14px;}
  .flashcard{width:100%;max-width:420px;height:260px;perspective:1200px;cursor:pointer;}
  .flashcard-inner{
    position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flashcard-face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);
    background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;
  }
  .flashcard-front .zh{font-size:3.4rem;font-weight:700;}
  .flash-hint{color:var(--ink-soft);font-size:.8rem;}
  .flashcard-back{transform:rotateY(180deg);}
  .flashcard-back .pinyin{font-size:1.3rem;}
  .flashcard-back .pos{color:var(--ink-soft);font-size:.85rem;}
  .flash-meaning{font-size:1.15rem;font-weight:600;}
  .flash-lesson{color:var(--ink-soft);font-size:.78rem;margin-top:6px;}
  .flash-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center;}

  footer{padding:36px 24px;text-align:center;color:var(--ink-soft);font-size:.85rem;border-top:1px solid var(--line);}

  .empty-note{
    text-align:center;padding:50px 24px;color:var(--ink-soft);
  }


  /* speak button */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    border:1.5px solid var(--red-seal-solid);background:#fff;color:var(--red-seal-solid);cursor:pointer;font-size:.8rem;
    margin-inline-start:8px;vertical-align:middle;flex-shrink:0;transition:.15s;
  }
  .speak-btn:hover{background:var(--red-seal-solid);color:#fff;}
  .zh-with-speak{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .audio-btn{
    display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;
    border:none;background:rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:.78rem;cursor:pointer;
    font-family:inherit;flex-shrink:0;white-space:nowrap;line-height:1;
  }
  .audio-btn:hover{background:rgba(255,255,255,.36);}
  .audio-btn.audio-fallback{outline:2px solid var(--gold);outline-offset:1px;}
  .audio-btn.audio-playing{animation:audioPulse 1s ease-in-out infinite;}
  @keyframes audioPulse{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.55);}50%{box-shadow:0 0 0 6px rgba(212,160,23,0);}}
  .topbar-tools{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:0;}
  .voice-select{
    max-width:150px;min-width:0;padding:7px 10px;border:1.5px solid var(--red-seal);border-radius:999px;
    background:transparent;color:var(--red-seal);font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;
  }
  .vocab-mini-title .audio-btn{background:var(--red-warm-solid);color:#fff;}
  .vocab-mini-title .audio-btn:hover{background:var(--red-deep);}

  /* Writing page */
  .writing-grid{max-width:1080px;margin:0 auto;padding:30px 24px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;}
  .char-tile{
    aspect-ratio:1;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Heiti SC','WenQuanYi Micro Hei',sans-serif;
    font-size:2rem;cursor:pointer;transition:.15s;
  }
  .char-tile:hover{border-color:var(--red-seal-solid);color:var(--red-seal-solid);box-shadow:var(--shadow);}
  .writing-modal-overlay{
    position:fixed;inset:0;background:rgba(36,20,18,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
  }
  .writing-modal-overlay.open{display:flex;}
  .writing-modal{
    background:var(--paper);border-radius:18px;padding:28px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow);
  }
  .writing-modal .close-x{float:inline-end;cursor:pointer;font-size:1.3rem;color:var(--ink-soft);}
  .writing-modal .stage{

            "py": "Nà shénme shíhou kāihuì?",

          },

            "speaker": "Wang Yixue",
            "zh": "开会的时候，我们用会议室的电脑还是自己的笔记本电脑？",
            "py": "Kāihuì de shíhou, wǒmen yòng huìyìshì de diànnǎo háishì zìjǐ de bǐjìběn diànnǎo?",
            "en": "During the meeting, should we use the meeting room's computer or our own laptops?",
            "ar": "أثناء الاجتماع، هل نستخدم حاسوب قاعة الاجتماعات أم حواسيبنا المحمولة الخاصة؟"
          },
          {
            "speaker": "Yang Tongle",
            "zh": "会议室的电脑或者自己的电脑都可以。",
            "py": "Huìyìshì de diànnǎo huòzhě zìjǐ de diànnǎo dōu kěyǐ.",
            "en": "Either the meeting room's computer or your own computer is fine.",
            "ar": "يمكن استخدام حاسوب قاعة الاجتماعات أو الحاسوب الخاص، كلاهما مناسب."
          },
          {
            "speaker": "Wang Yixue",
            "zh": "那到时候咱们早点儿过去，你帮我把电脑接好吧。",
            "py": "Nà dào shíhou zánmen zǎo diǎnr guòqù, nǐ bāng wǒ bǎ diànnǎo jiē hǎo ba.",

// All 18 lessons are complete.
const LESSON_STUBS = [];

/* ============ STATE ============ */
let lang = 'ar';
let route = {name:'home', param:null};
let vocabMode = 'table'; // 'table' | 'flashcards'
let flashState = {idx:0, flipped:false, order:null};

/* ============ PROGRESS (localStorage) ============ */
function loadProgress(){
  try{
    const raw = localStorage.getItem('hsk3_progress');
    const p = raw ? JSON.parse(raw) : null;
    return {completed:(p&&p.completed)||{}, quiz:(p&&p.quiz)||{}, lastLesson:(p&&p.lastLesson)||null};
  }catch(e){ return {completed:{}, quiz:{}, lastLesson:null}; }
}
function saveProgress(){ try{ localStorage.setItem('hsk3_progress', JSON.stringify(PROGRESS)); }catch(e){} }
let PROGRESS = loadProgress();
function isLessonComplete(id){ return !!PROGRESS.completed[id]; }
function toggleLessonComplete(id){
  if(PROGRESS.completed[id]) delete PROGRESS.completed[id];
  else PROGRESS.completed[id] = true;
  saveProgress();
  render();
}
function countCompleted(){ return Object.keys(PROGRESS.completed).length; }
function getQuizBest(id){ return PROGRESS.quiz[id] || null; }
function saveQuizResult(id, correct, total){
  const prev = PROGRESS.quiz[id];
  if(!prev || correct > prev.correct){ PROGRESS.quiz[id] = {correct, total}; saveProgress(); }
}
function nextIncompleteLessonId(){
  const found = LESSONS.find(l=> !isLessonComplete(l.id));
  return found ? found.id : LESSONS[0].id;
}

function t(key){ return UI[lang][key] || key; }
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  window.scrollTo(0,0);
  document.documentElement.scrollLeft = 0;
  document.body.scrollLeft = 0;
  document.getElementById('btn-ar').classList.toggle('active', l==='ar');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = t(el.getAttribute('data-t')); });
  render();
}
function go(name, param){
  route = {name, param};
  if(name==='lesson' && param){ PROGRESS.lastLesson = param; saveProgress(); }
  window.scrollTo(0,0); render(); updateNav();
}
function updateNav(){
  document.querySelectorAll('#mainnav a').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('data-route')===route.name);
  });
}

/* ============ RENDER ============ */
function render(){
  const app = document.getElementById('app');
  if(route.name==='home') app.innerHTML = renderHome();
  else if(route.name==='lessons') app.innerHTML = renderLessonsList();
  else if(route.name==='lesson') app.innerHTML = renderLessonDetail(route.param);
  else if(route.name==='grammar') app.innerHTML = renderGrammar();
  else if(route.name==='vocab') app.innerHTML = renderVocab();
  else if(route.name==='writing') app.innerHTML = renderWriting();
  else if(route.name==='tones') app.innerHTML = renderTones();
  attachHandlers();
  if(route.name==='writing') initWritingGrid();
}

        <h1>${lang==='ar' ? `${t('hero_title1')} <span class="accent">${t('hero_title_accent')}</span> ${t('hero_title2')}` : `${t('hero_title1')} <span class="accent">${t('hero_title_accent')}</span> ${t('hero_title2')}`}</h1>
        <p class="lead">${t('hero_lead')}</p>
        <div class="hero-cta">

function countVocab(){
  let n=0; LESSONS.forEach(l=> l.texts.forEach(tx=> n += tx.vocab.length)); return n;
}
function countGrammar(){
  let n=0; LESSONS.forEach(l=> n += l.grammar.length); return n;
}

function renderLessonsList(){
  let tiles = LESSONS.map(l=>{
    const best = getQuizBest(l.id);
    const badge = isLessonComplete(l.id)
      ? `<span class="badge-done" title="${lang==='ar'?'مكتمل':'Completed'}">✓</span>`
      : (best ? `<span class="badge-score">${best.correct}/${best.total}</span>` : '');
    return `
    <div class="lesson-tile" onclick="go('lesson',${l.id})">
      ${badge}
      <span class="lesson-num">${l.id}</span>
      <span class="zh zh-display">${l.zh}</span>
      <h4>${lang==='ar'? l.ar : l.en}</h4>
    </div>`;
  }).join('');
  let stubs = LESSON_STUBS.map(l=>`
    <div class="lesson-tile disabled">
      <span class="badge-soon">${t('soon')}</span>
      <span class="lesson-num">${l.id}</span>
      <span class="zh zh-display">${l.zh || '…'}</span>
      <h4>${l.en}</h4>
    </div>`).join('');
  return `
  <div class="page-head">
    <div class="container">
      <h1>${t('lessons_h')}</h1>
      <p>${t('lessons_p')}</p>
    </div>
  </div>
  <div class="lessons-grid">${tiles}${stubs}</div>`;
}

function checkQuiz(lessonId){
  const l = LESSONS.find(x=>x.id===lessonId);
  if(!l || !l.quiz) return;
  const wrap = document.getElementById('quiz-'+lessonId);
  let correct = 0;
  l.quiz.forEach((qq,qi)=>{
    const qEl = wrap.querySelector(`.quiz-q[data-qi="${qi}"]`);
    const selected = qEl.querySelector('input:checked');
    const opts = qEl.querySelectorAll('.quiz-opt');
    opts.forEach(o=>o.classList.remove('q-correct','q-wrong'));
    if(selected){
      const selIdx = parseInt(selected.value,10);
      if(selIdx === qq.answer){
        correct++;
        opts[selIdx].classList.add('q-correct');
      } else {
        opts[selIdx].classList.add('q-wrong');
        opts[qq.answer].classList.add('q-correct');
      }
    } else {
      opts[qq.answer].classList.add('q-correct');
    }
  });
  const resultEl = document.getElementById('quiz-result-'+lessonId);
  resultEl.textContent = `${t('quiz_score')}: ${correct} / ${l.quiz.length}`;
  resultEl.classList.add('show');
  saveQuizResult(lessonId, correct, l.quiz.length);
  if(correct === l.quiz.length && !isLessonComplete(lessonId)){
    resultEl.textContent += lang==='ar' ? ' 🎉 ممتاز! يمكنك وضع علامة إكمال على الدرس.' : ' 🎉 Great job! You can mark this lesson complete.';
  }
}

function resetQuiz(lessonId){
  const wrap = document.getElementById('quiz-'+lessonId);
  if(!wrap) return;
  wrap.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);
  wrap.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('q-correct','q-wrong'));
  const resultEl = document.getElementById('quiz-result-'+lessonId);
  resultEl.classList.remove('show');
  resultEl.textContent = '';
}

/* ============ SPEECH (pronunciation) — natural voices + per-speaker dialogue ============ */
// Voice type per speaker (F = female voice, M = male voice). Speakers not listed alternate automatically.
// Edit this list freely to match the characters of your course.
const SPEAKER_GENDER = {
  'Wang Yixue':'F','Bai Jiayue':'F','Bai Jiayue & Annie':'F','Annie':'F','Liu Xiaoxue':'F','Waitress':'F','Aunt Zhang':'F',
  'Liu Ming':'M','Wang Yifei':'M','Yang Tongle':'M','Chen Tianzhong':'M','Liu Xiaoming':'M','Waiter':'M'
};
const SPEECH = { ranked:[], override:null, token:0, timer:null, btn:null, audioMap:null };
const TTS_KEY = 'hsk_tts_voice';
let currentAudioEl = null;

/* ---- voice ranking: prefer neural / natural Mandarin (zh-CN) voices, never Cantonese ---- */
function voiceGender(v){
  const n = ((v.name||'')+' '+(v.voiceURI||'')).toLowerCase();
  if(/xiao(xiao|yi|han|meng|mo|qiu|rui|shuang|xuan|yan|you|chen)|huihui|yaoyao|ting-?ting|lili|mei-?jia|yu-?shu|hanhan|yating|female/.test(n)) return 'F';
  if(/yun(xi|jian|yang|feng|hao|ze|ye|xia)|kangkang|li-?mu|zhiwei|\bmale\b/.test(n)) return 'M';
  return 'U';
}
function scoreVoice(v){
  const lang = (v.lang||'').replace(/_/g,'-').toLowerCase();
  const name = (v.name||'').toLowerCase();
  const both = lang+' '+name;
  const isZh = lang.startsWith('zh') || lang.startsWith('cmn') || /chinese|mandarin|普通话|中文/.test(name);
  if(!isZh) return -1;
  if(/zh-hk|yue|cantonese|粤|廣東|广东|hong ?kong|sin-?ji|hiugaai|wanlung|hiumaan/.test(both)) return -1;
  let s = 10;
  if(lang==='zh-cn' || lang==='cmn-cn' || /china|mainland|大陆|中国/.test(name)) s += 20;
  if(/zh-tw|taiwan|台|hanhan|yating|zhiwei|mei-?jia|hsiao/.test(both)) s -= 25;
  if(/natural|neural|online/.test(name)) s += 60;
  if(/premium|enhanced|siri|高质量|增强/.test(name)) s += 40;
  if(/google/.test(name)) s += 20;
  if(/xiaoxiao/.test(name)) s += 12;
  if(/yunxi|yunjian/.test(name)) s += 8;
  if(/compact|espeak|eloquence/.test(name)) s -= 30;
  return s;
}
function refreshVoices(){
  if(!('speechSynthesis' in window)) return;
  const all = window.speechSynthesis.getVoices() || [];
  SPEECH.ranked = all.map(v=>({v, s:scoreVoice(v), g:voiceGender(v)}))
                     .filter(x=>x.s>=0).sort((a,b)=>b.s-a.s);
  let saved = null;
  try{ saved = localStorage.getItem(TTS_KEY); }catch(e){}
  const hit = saved ? SPEECH.ranked.find(x=>(x.v.voiceURI||x.v.name)===saved) : null;
  SPEECH.override = hit ? hit.v : null;
  buildVoiceSelect();
}
function buildVoiceSelect(){
  const sel = document.getElementById('voice-select');
  if(!sel) return;
  sel.innerHTML = '';
  const auto = document.createElement('option');
  auto.value = ''; auto.textContent = '🔊 تلقائي / Auto';
  sel.appendChild(auto);
  SPEECH.ranked.forEach(x=>{
    const o = document.createElement('option');
    o.value = x.v.voiceURI || x.v.name;
    o.textContent = x.v.name;
    sel.appendChild(o);
  });
  sel.value = SPEECH.override ? (SPEECH.override.voiceURI || SPEECH.override.name) : '';
  sel.style.display = SPEECH.ranked.length ? '' : 'none';
}
function onVoiceChange(sel){
  const id = sel.value;
  const hit = id ? SPEECH.ranked.find(x=>(x.v.voiceURI||x.v.name)===id) : null;
  SPEECH.override = hit ? hit.v : null;
  try{ if(id) localStorage.setItem(TTS_KEY, id); else localStorage.removeItem(TTS_KEY); }catch(e){}
  speak('你好！我是你的中文老师。');
}
// the pool of voices usable for a speaker type; only the top tier is used so a robotic voice never mixes with a natural one
function voicePool(kind){
  if(SPEECH.override) return [{v:SPEECH.override, g:voiceGender(SPEECH.override)}];
  const r = SPEECH.ranked;
  if(!r.length) return [];
  const good = r.filter(x=>x.s >= r[0].s - 25);
  if(!kind) return good;
  const pool = good.filter(x=>x.g===kind).concat(good.filter(x=>x.g==='U'));
  return pool.length ? pool : good;
}
// k = how many speakers of this type were already assigned → a different voice (or a slightly shifted pitch) for each
function makeSlot(kind, k){
  const pool = voicePool(kind);
  const item = pool.length ? pool[k % pool.length] : null;
  let pitch = 1;
  if(kind){
    const g = item ? item.g : 'U';
    if(g==='U') pitch = kind==='F' ? 1.06 : 0.86;
    else if(g!==kind) pitch = kind==='F' ? 1.15 : 0.82;
  }
  const wraps = pool.length ? Math.floor(k/pool.length) : k;
  pitch += wraps * (kind==='M' ? -0.07 : 0.07);
  return { voice: item ? item.v : null, pitch: Math.min(1.4, Math.max(0.6, pitch)) };
}

/* ---- text preparation: make the text sound the way a person would actually say it ---- */
function cleanZh(s){
  s = String(s||'');
  s = s.replace(/[（(]\s*=[^）)]*[）)]/g,'');                  // （=每个苹果都很大。） glosses
  s = s.replace(/\s*[（(][^）)]*[A-Za-z][^）)]*[）)]/g,'');    // (的 omitted) notes
  s = s.replace(/[（(]([^）)]*)[）)]/g,'$1');                   // 上(学) → 上学
  s = s.replace(/(\d)日\s*[\/／]\s*号/g,'$1日');
  s = s.replace(/\s*[\/／]\s*/g,'，');                          // alternatives → short pause
  s = s.replace(/\.{2,}|…+|⋯+/g,'，').replace(/[~～]/g,'');
  s = s.replace(/\+\s*(\d)/g,'加$1');
  // phone numbers are read digit by digit (1 = yāo)
  s = s.replace(/\d[\d\s]{6,}\d/g, m => m.trim().replace(/\s+/g,'，').replace(/\d/g, d => '零幺二三四五六七八九'[+d]));
  s = s.replace(/\?/g,'？').replace(/!/g,'！').replace(/,/g,'，').replace(/;/g,'；').replace(/:/g,'：');
  s = s.replace(/([\u4e00-\u9fff])\.(\s|$)/g,'$1。$2');
  return s.replace(/\s+/g,' ').trim();
}
// one line → sentence-sized chunks, so the voice gets proper sentence intonation and pauses
function chunkItems(zh, slot, slow, endGap){
  const clean = cleanZh(zh);
  if(!/[\u4e00-\u9fffA-Za-z0-9]/.test(clean)) return [];
  const parts = (clean.match(/[^。！？；]+[。！？；]*/g) || [clean]).map(p=>p.trim()).filter(p=>/[\u4e00-\u9fffA-Za-z0-9]/.test(p));
  return parts.map((p,i)=>({
    text: /[。！？；，]$/.test(p) ? p : p+'。',
    slot,
    gap: i===parts.length-1 ? endGap : (slow ? 380 : 220)
  }));
}
// dialogue: every speaker keeps the same voice for the whole conversation, with a natural pause between turns
function buildDialogueItems(lines, slow, genders){
  genders = genders || SPEAKER_GENDER;
  const slotBy = {}, count = {F:0, M:0};
  let lastKind = 'M';
  const items = [];
  lines.forEach(ln=>{
    const sp = ln.speaker || '';
    if(!(sp in slotBy)){
      const kind = genders[sp] || (lastKind==='F' ? 'M' : 'F');
      slotBy[sp] = makeSlot(kind, count[kind]++);
      lastKind = kind;
    }
    chunkItems(ln.zh, slotBy[sp], slow, slow ? 750 : 480).forEach(it=>items.push(it));
  });
  return items;
}
function buildTextItems(text, slow){
  const t0 = String(text||'');
  if(/(^|\s)A\s*[:：]/.test(t0) && /\sB\s*[:：]/.test(t0)){
    const parts = t0.split(/(?:^|\s)[AB]\s*[:：]\s*/).map(x=>x.trim()).filter(Boolean);
    return buildDialogueItems(parts.map((p,i)=>({speaker: i%2 ? 'B' : 'A', zh:p})), slow, {A:'F', B:'M'});
  }
  return chunkItems(t0, makeSlot(null,0), slow, slow ? 700 : 400);
}
function buildVocabItems(words, slow){
  const slot = makeSlot(null,0), items = [];
  words.forEach(w=> chunkItems(w, slot, slow, slow ? 1400 : 900).forEach(it=>items.push(it)));
  return items;
}

/* ---- playback queue ---- */
function stopSpeech(){
  SPEECH.token++;
  clearTimeout(SPEECH.timer);
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  if(currentAudioEl){ try{ currentAudioEl.pause(); currentAudioEl.currentTime = 0; }catch(e){} }
  if(SPEECH.btn){ SPEECH.btn.classList.remove('audio-playing'); SPEECH.btn = null; }
}
function runQueue(items, btnEl, slow){
  if(!('speechSynthesis' in window)){ alert(t('tts_unsupported')); return; }
  stopSpeech();
  items = (items||[]).filter(it=>it && it.text);
  if(!items.length) return;
  const synth = window.speechSynthesis, my = SPEECH.token;
  SPEECH.btn = btnEl || null;
  if(btnEl) btnEl.classList.add('audio-playing');
  let i = 0;
  const finish = ()=>{ if(my!==SPEECH.token) return; if(SPEECH.btn){ SPEECH.btn.classList.remove('audio-playing'); SPEECH.btn = null; } };
  const next = ()=>{
    if(my!==SPEECH.token) return;
    if(i>=items.length){ finish(); return; }
    const it = items[i++], sl = it.slot || {};
    const u = new SpeechSynthesisUtterance(it.text);
    if(sl.voice){ u.voice = sl.voice; u.lang = sl.voice.lang; } else { u.lang = 'zh-CN'; }
    u.rate = slow ? 0.65 : 0.92;
    u.pitch = sl.pitch || 1;
    u.volume = 1;
    let done = false, guard = null;
    const fin = ()=>{ if(done) return; done = true; clearTimeout(guard); if(my!==SPEECH.token) return; SPEECH.timer = setTimeout(next, it.gap || 250); };
    u.onend = fin; u.onerror = fin;
    guard = setTimeout(fin, 4000 + it.text.length * (slow ? 1300 : 800));   // safety net for engines that never fire onend
    synth.speak(u);
  };
  next();   // first utterance starts synchronously (needed by iOS/Safari: must run inside the tap)
}
function speak(text, slow){
  try{ runQueue(buildTextItems(text, slow), null, slow); }catch(e){ console.error(e); }
}

/* ---- recorded mp3 first (if present), natural TTS as fallback ---- */
function getAudioMap(){
  if(SPEECH.audioMap) return SPEECH.audioMap;
  const map = {};
  try{
    LESSONS.forEach(l=>{
      (l.texts||[]).forEach(tx=>{
        if(tx.dialogueAudio) map[tx.dialogueAudio] = {type:'dialogue', lines:(tx.lines||[]).map(x=>({speaker:x.speaker, zh:x.zh}))};
        if(tx.vocabAudio) map[tx.vocabAudio] = {type:'vocab', words:(tx.vocab||[]).map(v=>v.zh)};
      });
      if(l.tongue && l.tongue.audio) map[l.tongue.audio] = {type:'text', text:l.tongue.zh};
    });
  }catch(e){ console.error(e); }
  return (SPEECH.audioMap = map);
}
function speakFallback(src, text, btnEl, slow){
  const m = getAudioMap()[src];
  let items;
  if(m && m.type==='dialogue') items = buildDialogueItems(m.lines, slow);
  else if(m && m.type==='vocab') items = buildVocabItems(m.words, slow);
  else items = buildTextItems(m ? m.text : text, slow);
  runQueue(items, btnEl, slow);
}
function playAudio(src, fallbackText, btnEl, slow){
  try{
    stopSpeech();
    currentAudioEl = new Audio(src);
    currentAudioEl.playbackRate = slow ? 0.8 : 1;     // real recordings: natural speed (slow button = gentle slow-down)
    currentAudioEl.preservesPitch = true;
    currentAudioEl.mozPreservesPitch = true;
    currentAudioEl.webkitPreservesPitch = true;
    let failed = false;
    const clearBtn = ()=>{ if(btnEl) btnEl.classList.remove('audio-playing'); };
    const onFail = (reason)=>{
      if(failed) return; failed = true;
      console.error('audio failed:', src, reason);
      clearBtn();
      if(btnEl) btnEl.classList.add('audio-fallback');
      if(fallbackText || getAudioMap()[src]) speakFallback(src, fallbackText, btnEl, slow);
      else alert(t('audio_missing'));
    };
    currentAudioEl.addEventListener('error', ()=> onFail('error event'));
    currentAudioEl.addEventListener('ended', clearBtn);
    currentAudioEl.play().then(()=>{
      if(failed) return;
      if(btnEl){ btnEl.classList.remove('audio-fallback'); btnEl.classList.add('audio-playing'); SPEECH.btn = btnEl; }
    }).catch(e=> onFail(e));
  }catch(e){ console.error(e); if(fallbackText) speakFallback(src, fallbackText, btnEl, slow); }
}
function escapeQuotes(s){ return (s||'').replace(/'/g,"\\'"); }

function getUniqueChars(){
  const set = new Set();
  LESSONS.forEach(l=> l.texts.forEach(tx=> tx.vocab.forEach(v=>{
    for(const ch of v.zh){ if(/[\u4e00-\u9fff]/.test(ch)) set.add(ch); }
  })));
  return Array.from(set);
}

function getCharInfoMap(){
  const map = {};
  // pass 1: single-character vocab words give the most reliable pinyin+meaning for that character
  LESSONS.forEach(l=> l.texts.forEach(tx=> tx.vocab.forEach(v=>{
    const chars = [...v.zh].filter(ch=>/[\u4e00-\u9fff]/.test(ch));
    if(chars.length===1 && !map[chars[0]]){
      map[chars[0]] = {py:v.py, en:v.en, ar:v.ar, word:v.zh, whole:false};
    }
  })));
  // pass 2: accurate individual-character dictionary for characters only ever seen inside multi-character words
  Object.keys(CHAR_MEANINGS).forEach(ch=>{
    if(!map[ch]){
      const m = CHAR_MEANINGS[ch];
      map[ch] = {py:m.py, en:m.en, ar:m.ar, word:ch, whole:false};
    }
  });
  // pass 3: last-resort fallback — characters neither in vocab as standalone words nor in the dictionary
  LESSONS.forEach(l=> l.texts.forEach(tx=> tx.vocab.forEach(v=>{
    const chars = [...v.zh].filter(ch=>/[\u4e00-\u9fff]/.test(ch));
    if(chars.length>1){
      chars.forEach(ch=>{
        if(!map[ch]) map[ch] = {py:v.py, en:v.en, ar:v.ar, word:v.zh, whole:true};
      });
    }
  })));
  return map;
}

let currentWriter = null;
function initWritingGrid(){ /* placeholder for future lazy-load hooks */ }
function openWritingModal(ch){
  document.getElementById('writing-overlay').classList.add('open');
  document.getElementById('modal-char-label').textContent = ch;
  const stage = document.getElementById('writing-stage');
  stage.innerHTML = '';

  const info = (window.__charInfoMap || {})[ch];
  const meaningEl = document.getElementById('modal-char-meaning');
  if(info){
    const meaning = lang==='ar' ? info.ar : info.en;
    const wordNote = info.whole ? `<span class="char-meaning-note">(${lang==='ar'?'من كلمة':'from'} <span class="zh">${info.word}</span>)</span>` : '';
    meaningEl.innerHTML = `
      <div class="char-meaning-py">${info.py}</div>
      <div class="char-meaning-text">${meaning} ${wordNote}</div>
      <button class="speak-btn" onclick="speak('${info.word}')" title="${t('speak')}">🔊</button>
    `;
  } else {
    meaningEl.innerHTML = '';
  }

  try{
    currentWriter = HanziWriter.create('writing-stage', ch, {
      width:256, height:256, padding:10,
      showOutline:true, strokeAnimationSpeed:1, delayBetweenStrokes:250,
      strokeColor:'#44190E', outlineColor:'#E5D9CE', radicalColor:'#DC460A'
    });
  }catch(e){ stage.innerHTML = '<p style="padding:20px;font-size:.85rem;">Could not load stroke data for this character.</p>'; }
}
function closeWritingModal(){
  document.getElementById('writing-overlay').classList.remove('open');
  currentWriter = null;
}
function writingAnimate(){ if(currentWriter) currentWriter.animateCharacter(); }
function writingQuiz(){ if(currentWriter) currentWriter.quiz(); }
function writingReset(){ if(currentWriter){ currentWriter.hideCharacter(); currentWriter.showOutline(); } }
